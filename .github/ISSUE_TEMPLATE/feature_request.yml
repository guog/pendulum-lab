name: Feature request
description: 提出需求或改进建议
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景、受影响的人和现有做法的不足。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 期望行为与验收方式
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 约束、替代方案与相关需求
